<h2>Cart</h2>
<ul>
  @for (cl of cartLines(); track cl.product.id) {
    <li>
      <p>{{ cl.product.name }}</p>
      <p>{{ cl.quantity }}</p>
      <div class="buttons">
        <button (click)="minusOne(cl.product.id)">➖</button>
        <button (click)="plusOne(cl.product.id)">➕</button>
        <button (click)="remove(cl.product.id)">❌</button>
      </div>
    </li>
  } @empty {
    <p>Empty cart</p>
  }
  <p>Total : {{ total() | money }}</p>
</ul>
