<div class="content" appGsapEntrance>
  @for (p of products(); track p.id) {
    <app-product-card
      class="card"
      [product]="p"
      (delete)="handleWantToDelete($event)"
    ></app-product-card>
  } @empty {
    <p>No product</p>
  }
</div>
@if (selectedProduct()) {
  <app-confirm-dialog
    [productName]="selectedProduct()!.name"
    (confirm)="handleConfirm()"
    (cancel)="handleCancel()"
  ></app-confirm-dialog>
}
